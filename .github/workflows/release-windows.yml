name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild:native

      - name: Build and publish Windows artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Avoid interactive CSC prompts on unsigned CI builds.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run release:win

      - name: Set release title without v prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="${TAG#v}"
          CURRENT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name -q .name 2>/dev/null || true)"
          if [ "$CURRENT" = "$TITLE" ]; then
            echo "Release title already set to ${TITLE}"
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" || {
            echo "Title edit skipped (release may already be finalized)"
            exit 0
          }
