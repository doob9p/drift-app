appId: app.drift.desktop
productName: Drift
copyright: Drift
electronVersion: 35.7.5
directories:
  output: release
  buildResources: resources/brand
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  # Runtime window / About icons (exe icon is embedded separately on Windows).
  - resources/brand/icon.png
  - resources/brand/icon.ico
asar: true
asarUnpack:
  - "**/*.node"
  - "**/node-pty/**"
  # Cursor SDK ships platform binaries (rg, sandbox, tree-sitter) that must run outside asar.
  - "**/@cursor/sdk-*/**"
mac:
  category: public.app-category.developer-tools
  icon: resources/brand/icon.icns
  target:
    - dmg
    - zip
  # Code signing / notarization is intentionally off for now.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: "Drift records meeting audio from your microphone for local transcripts and summaries."
dmg:
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
win:
  icon: resources/brand/icon.ico
  # Embed icon/metadata into Drift.exe, but skip Authenticode signing for now.
  # (signAndEditExecutable:false leaves the Electron default icon on the exe.)
  signAndEditExecutable: true
  signExecutable: false
  # Keep native modules unpackaged for node-pty on Windows.
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # Portable OpenSSH so SSH works without the Windows optional feature.
  extraResources:
    - from: resources/win-openssh
      to: win-openssh
      filter:
        - "**/*"
        - "!README.md"
        - "!.gitkeep"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Drift
publish:
  - provider: github
    owner: doob9p
    repo: drift-app
    releaseType: release
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
npmRebuild: false
electronLanguages:
  - en
  - ko
