appId: app.drift.desktop
productName: Drift
copyright: Drift
electronVersion: 35.7.5
directories:
  output: release
  buildResources: resources/brand
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
  - "**/node-pty/**"
mac:
  category: public.app-category.developer-tools
  icon: resources/brand/icon.icns
  target:
    - dmg
    - zip
  # Code signing / notarization is intentionally off for now.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: "Drift records meeting audio from your microphone for local transcripts and summaries."
dmg:
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
win:
  icon: resources/brand/icon.ico
  # Unsigned builds (no Authenticode cert yet).
  signAndEditExecutable: false
  # Keep native modules unpackaged for node-pty on Windows.
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Drift
publish:
  - provider: github
    owner: doob9p
    repo: drift-app
    releaseType: release
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
npmRebuild: false
electronLanguages:
  - en
  - ko
